        let settled = false;
        const res = () => { if (settled) return; settled = true; clearTimeout(guard); res0(); };
        const finishNow = () => {
          if (!job.landed) { job.landed = true; job.tLand = now(); st.coins = st.coins.filter(k => k.job !== job && !coins.includes(k)); spec.onLand && spec.onLand(); }
          if (job.onHanded) { const f = job.onHanded; job.onHanded = null; f(); }
          job.dead = true; const i = fx.jobs.indexOf(job); if (i >= 0) fx.jobs.splice(i, 1);
          res();
        };
        // 依畫面左右排定每枚錢的角色
        const order = coins.map((k, i) => ({ i, x: k.cur ? proj(L.cam, k.cur.p).x : i })).sort((a, b) => a.x - b.x);
        const segs = segsFor(spec.value), roles = [];
        order.forEach((e, j) => { roles[e.i] = segs[j]; });
        const job = { bars: spec.target.bars, mark: spec.target.mark, v: spec.value, quick, roles, ink: [], items: [], n: coins.length, landed: false, onLand: spec.onLand, onHanded: spec.onHanded, res, flyT: opt.flyT };
        // 保險：畫面暫停（不在視窗內）時直接落定

    }

    /* ----- 自動擲卦：一把撒出全部，再一起化爻 ----- */
    let burstPlan = null;
    function prepareBurst(groupsN) {   // 一按下就開始算軌跡（分段，不卡畫面）
      const mouth = shellMouth(shellPose(0, true, .07));
      burstPlan = { n: groupsN, p: S.planBurst({ n: groupsN * 3, mouth, apex: 125, groupDelay: .06, visible, yield: () => new Promise(r => setTimeout(r, 0)) }) };
      return burstPlan.p;
    }
    async function throwAll(groups) {
      const n = groups.length, speed = 1.35, s = st.shell;
      const planP = burstPlan && burstPlan.n === n ? burstPlan.p : prepareBurst(n);
      burstPlan = null;
      st.coins = []; st.lite = true;
      s.src = null; s.liftTarget = 1; wake();
      const [plan] = await Promise.all([planP, waitUntil(now() + .2)]);

      const tRel = .07;
      st.plan = plan; st.speed = speed; st.tLaunch = s.flickT0 + tRel / speed;
      // 誰先落底誰在下面
      const byTouch = plan.coins.map((c, i) => [c.delay + (c.tTouch == null ? 9 : c.tTouch), i]).sort((a, b) => a[0] - b[0]);
      const stack = []; byTouch.forEach(([, i], r) => { stack[i] = r; });
      st.coins = plan.coins.map((c, i) => ({ mode: 'plan', c, bei: !!c.bei, ev: 0, cur: null, labelT0: 0, noLabel: true, g: c.g, i: i % 3, stack: stack[i] }));
      // 聲音：每組一聲就好
      Sound.swish(0, .16);
      plan.coins.forEach((c, i) => {
        if (i % 3) return;
        const x0 = (tRel + c.delay) / speed;
        Sound.rattle(x0, .16, 1.05 + rand() * .2);
        c.events.forEach(e => {
          const x = (tRel + c.delay + e.t) / speed;
          if (e.type === 'entry') Sound.splash(x, clamp(e.speed / 2600, .2, .55), e.flat, .9 + rand() * .3);
          else if (e.type === 'touch') Sound.uclink(x, .18, .95 + rand() * .15);
        });
      });
      setTimeout(() => buzz(14), (tRel + .4) / speed * 1000);
      setTimeout(() => { if (!st.shell.src) st.shell.liftTarget = 0; }, 380 / speed);
      const tEnd = st.tLaunch + Math.max(...plan.coins.map(c => c.delay + (c.tTouch == null ? c.tRest : c.tTouch) + .22)) / speed;
      await waitUntil(tEnd);
      return true;
    }
    // specs[g] = { target, value, onLand }：第 g 組化成第 g 爻，由初爻往上依序
    function transformAll(specs) {
      const jobs = specs.map((sp, g) => startJob(st.coins.filter(k => k.g === g && !k.job), sp, { quick: true, speed: 2.1, delay: g * .11, lite: true, flyT: .34, silent: g > 0 }));
      return Promise.all(jobs);
    }

    /* ----- 生命週期 ----- */
    const ro = new ResizeObserver(() => onRO());
    ro.observe(cv);
    const io = new IntersectionObserver(es => es.forEach(e => { st.visible = e.isIntersecting; if (st.visible) wake(); }), { rootMargin: '60px' });
    io.observe(cv);
    function refreshTheme() { readTokens(); if (L.cam) buildLayers(); wake(); }
    const onRO = () => { if (layout()) wake(); };
    readTokens();

    return {
      layout() { if (layout()) wake(); }, refreshTheme, shake, throwCoins, transform, jump, clear, wake, visible,
      prepareBurst, throwAll, transformAll,
      get busy() { return st.coins.some(k => k.mode === 'plan' || k.mode === 'rise') || fx.jobs.length > 0; },
      _st: st, _L: L
    };
  }

  window.Pond = { mount, Sound };
})();

  /* ---------- 狀態 ---------- */

  }
  function dateLabel(info) { const dt = new Date(info.y, info.m - 1, info.d); return `${info.m}月${info.d}日（週${WEEK[dt.getDay()]}）`; }

  /* ---------- 山水 ---------- */
  function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function paintMountains(ctx, W, H, rgb, seed, scale) {

    const layers = [
      { base: .78, n: 5, h0: .26, h1: .52, a: .07, blur: 9 },
      { base: .9, n: 4, h0: .18, h1: .38, a: .09, blur: 4 },
      { base: 1.0, n: 4, h0: .1, h1: .26, a: .13, blur: 1.6 }

    });
  }

  async function enterCast() {

  async function beginHold(src, quick) {

    state.busy = true; updateCastUI();
    Sound.unlock();

    pond.shake.begin(src, quick);

  }
  async function release(o) {

  function tap(o) { ctl.begun = beginHold('auto'); return release(o); }
  // 一擲：拋錢 → 落定 → 化爻。快速模式下，錢一離開水盆就接著擲下一次（前一組還在飛向爻位）
  async function castOnce(o) {
    const t = E.tossCoins(), i = state.values.length, info = VALUE_INFO[t.value];
    state.values.push(t.value);
    const say = `${POS_CN[i]}爻：${info.backs}，${info.name}${info.moving ? '，會變' : ''}`;
    if (still()) { pond.jump(t.coins); Sound.clink(0, .3, 1); }
    else await pond.throwCoins(t.coins, { quick: !!o.quick, power: o.power });
    $('#castHint').textContent = say;
    if (still()) drawSlot(i, t.value, false);
    else {
      let handed; const handedP = new Promise(r => { handed = r; });
      const landed = pond.transform(slotParts(i), { value: t.value, faces: t.coins, quick: !!o.quick, onLand: () => drawSlot(i, t.value, 'landed'), onHanded: handed });
      state.landing.push(landed); state.flying++;
      landed.then(() => { state.flying = Math.max(0, state.flying - 1); });
      await (o.quick ? handedP : landed);
    }
    state.busy = false;
    if (state.values.length === 6) {
      state.busy = true;
      await Promise.all(state.landing); state.landing = [];
      state.busy = false; updateCastUI(); await finishCast();
    } else { updateCastUI(); if (!o.quick) $('#castHint').textContent = `${say} · 再搖第 ${i + 2} 次`; }
  }
  // 自動擲卦：從問題頁或擲到一半都可以按，替你把剩下的幾次擲完（快速、接連著擲）
  function syncAuto() {
    const b = $('#autoBtn'); if (!b) return;
    const n = state.values.length, mid = state.stage === 'cast' && n > 0 && n < 6;
    b.hidden = state.stage === 'result';
    b.setAttribute('aria-busy', String(!!state.auto));
    b.disabled = !!state.auto || state.busy || (state.stage === 'cast' && n >= 6);
    b.querySelector('.t').textContent = state.auto ? '自動擲卦中…' : mid ? `自動擲完剩下 ${6 - n} 次` : '自動擲卦';
  }
  // 一次撒出剩下的錢，再一起化爻（由初爻往上）；減少動態時直接畫上
  async function autoFinish() {
    if (state.busy || ctl.holding || state.auto || state.stage === 'result') return;
    state.auto = true; state.busy = true; syncAuto(); updateCastUI();
    Sound.unlock();
    try {
      const n0 = state.stage === 'ask' ? 0 : state.values.length, k = 6 - n0;
      if (k <= 0) return;
      if (!still()) pond.prepareBurst(k);   // 先開始算軌跡，和展開動畫同時進行
      if (state.stage === 'ask') await enterCast();
      const tosses = Array.from({ length: k }, () => E.tossCoins());
      tosses.forEach(t => state.values.push(t.value));
      $('#castHint').textContent = k === 6 ? '六次一起擲' : `剩下 ${k} 次一起擲`;
      if (still()) {
        tosses.forEach((t, j) => drawSlot(n0 + j, t.value, false));
      } else {
        await pond.throwAll(tosses.map(t => t.coins));
        $('#castHint').textContent = '化爻';
        await pond.transformAll(tosses.map((t, j) => ({ target: slotParts(n0 + j), value: t.value, onLand: () => drawSlot(n0 + j, t.value, 'landed') })));
      }
      $('#castHint').textContent = '卦成';
      state.busy = false;
      await finishCast();
    } finally {
      state.auto = false; syncAuto();
      if (state.stage === 'cast' && !state.busy) updateCastUI();
    }
  }
  async function finishCast() {
    state.busy = true; $('#tossBtn').disabled = true;
    await sleep(520);
    const rec = makeRecord(state.values, 'coins', null);

    state.busy = false;
    await showResult(rec, { fromCast: true });
  }
  const seal = $('#tossBtn');

  });

  // 搖手機：DeviceMotion（iOS 需在點按中取得授權）
  const motionAvailable = () => 'DeviceMotionEvent' in window && window.matchMedia('(pointer: coarse)').matches;
  async function toggleMotion() {
    if (motion.on) { stopMotion(); updateCastUI(); return; }
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r === 'denied') { $('#castHint').textContent = '沒有取得動作感測的權限，請改按住印章搖'; return; }
      }
    } catch (e) { $('#castHint').textContent = '這裡讀不到手機的動作感測，請改按住印章搖'; return; }
    Sound.unlock();
    motion.on = true; motion.got = false; motion.lp = null;
    window.addEventListener('devicemotion', onMotion);
    $('#motionBtn').setAttribute('aria-pressed', 'true');
    $('#castHint').textContent = '搖一搖手機，錢會從龜殼裡搖出來';
    clearTimeout(motion.timer);

      if (motion.on && !motion.got) { stopMotion(); $('#castHint').textContent = '這個畫面收不到手機的動作感測（預覽視窗會擋），請改按住印章搖；放到網站上就能搖手機。'; }
    }, 1600);
  }
  function stopMotion() { motion.on = false; window.removeEventListener('devicemotion', onMotion); $('#motionBtn').setAttribute('aria-pressed', 'false'); }
  function onMotion(e) {
    let x, y, z; const a = e.acceleration;
    if (a && a.x != null) { x = a.x; y = a.y; z = a.z || 0; }
    else {
      const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
      const v = [g.x, g.y, g.z || 0];
      motion.lp = motion.lp ? motion.lp.map((q, i) => q * .9 + v[i] * .1) : v;
      x = v[0] - motion.lp[0]; y = v[1] - motion.lp[1]; z = v[2] - motion.lp[2];
    }
    motion.got = true;
    const mag = Math.hypot(x, y, z), t = performance.now() / 1000;
    if (!ctl.holding) {
      if (mag > 7 && !state.busy && !state.auto && state.stage !== 'result' && !(state.stage === 'cast' && state.values.length >= 6)) {
        motion.t0 = t; motion.quiet = null; motion.peak = mag;
        ctl.begun = beginHold('motion');
      }
      return;
    }
    if (ctl.src !== 'motion') return;
    pond.shake.input(x, y);
    motion.peak = Math.max(motion.peak, mag);

    if (mag < 3) { if (motion.quiet == null) motion.quiet = t; } else motion.quiet = null;
    const stopped = motion.quiet != null && t - motion.quiet > .3 && dur > .6;
    if (stopped || (mag > 24 && dur > .45) || dur > 3.5) {

    }
  }

    });
    const head = '<div class="h">六神</div><div class="h">伏神</div><div class="h"></div><div class="h">本卦</div><div class="h"></div><div class="h">六親</div><div class="h">變卦</div>';
    const changed = chart.lines.filter(l => l.moving).map(l => `${l.pos}${l.branch}化${l.change.branch}（${l.change.liuqin}${l.change.el}）`).join('、');
    return `<div class="chart">
      <div class="chart-meta"><span>月建 <b>${info.month.text}</b></span><span>日辰 <b>${info.day.text}</b></span><span>旬空 <b>${info.kong.join('')}</b></span><span>用神 <b>${esc(verdict.ys.label)}</b></span></div>
      <div class="chart-grid">${head}${rows}</div>
      <p class="chart-foot">${esc(ben.name)}（${esc(ben.palaceName)}宮）${bian ? `之 ${esc(bian.name)}；${changed}。變爻六親依本卦宮五行。` : '，六爻皆靜。'}</p>
    </div>`;
  }

  async function showResult(rec, opts) {
    const fromCast = opts && opts.fromCast;
    state.record = rec; state.topic = rec.topic; state.gender = rec.gender || '';
    const c = compute(rec);
    const firstRect = fromCast && !still() ? $('#slots').getBoundingClientRect() : null;
    fillSummary(rec.question, rec.topic);
    const result = $('#result');
    result.classList.remove('revealing', 'leaving');
    $('#plate').innerHTML = plateHTML(c);
    $('#reading').innerHTML = readingHTML(rec, c);
    const base = fromCast ? 760 : 260;
    $('#reading').style.setProperty('--base', base + 'ms');
    $('#plate').style.setProperty('--base', (fromCast ? 560 : 120) + 'ms');
    result.style.setProperty('--glyph-d', (fromCast ? 360 : 40) + 'ms');
    result.style.setProperty('--seal-d', (fromCast ? 720 : 260) + 'ms');
    setStage('result');
    wireReading(rec, c);
    void result.offsetWidth;
    result.classList.add('revealing');
    // 卦畫從擲卦處飛到卦盤
    const lines = $('#plateLines');
    const last = lines.getBoundingClientRect();
    if (last.top < 0 || last.top > window.innerHeight * .7) {
      const target = window.scrollY + $('#result').getBoundingClientRect().top - 18;
      window.scrollTo({ top: Math.max(0, target), behavior: 'auto' });
    }
    if (firstRect && firstRect.width) {
      const l2 = lines.getBoundingClientRect();
      const dx = firstRect.left + 42 - l2.left, dy = firstRect.top - l2.top;
      const sx = Math.max(.5, (firstRect.width - 150) / l2.width), sy = firstRect.height / l2.height;
      lines.style.transformOrigin = '0 0';
      lines.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
      void lines.offsetWidth;
      lines.style.transition = 'transform .78s cubic-bezier(.22,1,.36,1)';
      lines.style.transform = '';
      lines.addEventListener('transitionend', () => { lines.style.transition = ''; lines.style.transformOrigin = ''; }, { once: true });
    }
    document.title = `${c.chart.ben.name}・${c.verdict.grade}｜六爻排盤`;
  }

  function wireReading(rec, c) {
    $$('#reading .exp-btn').forEach(b => b.addEventListener('click', () => {
      const body = document.getElementById(b.getAttribute('aria-controls'));
      const open = body.classList.toggle('is-closed') === false;
      b.setAttribute('aria-expanded', String(open));
    }));
    const rt = $('#retopicBtn');
    renderTopics($('#retopicChips'), rec.topic, id => {
      const r2 = Object.assign({}, rec, { topic: id, gender: id === 'love' ? (rec.gender || '') : '' });
      history.upsert(r2); refreshHistoryCount();
      showResult(r2, { fromCast: false });
    });
    rt.addEventListener('click', () => {
      const p = $('#retopic'); const open = p.classList.toggle('is-closed') === false; rt.setAttribute('aria-expanded', String(open));
    });
    $('#againBtn').addEventListener('click', askAgain);
    $('#cardBtn').addEventListener('click', () => openCard(rec, c));
  }

  async function askAgain() {
    const result = $('#result');
    if (!still()) { result.classList.add('leaving'); await sleep(260); }
    state.values = []; state.record = null;
    $('#question').value = '';
    buildSlots(); pond.clear();
    setStage('ask');
    updateCastUI();
    document.title = '六爻排盤';
    window.scrollTo({ top: 0, behavior: still() ? 'auto' : 'smooth' });
    setTimeout(() => $('#question').focus({ preventScroll: true }), 450);
  }
  $('#homeLink').addEventListener('click', e => { e.preventDefault(); if (state.busy || state.auto) return; if (state.stage === 'result') askAgain(); else if (state.stage === 'cast') { state.values = []; buildSlots(); pond.clear(); setStage('ask'); updateCastUI(); } });

  /* ---------- 卦簿 ---------- */
  function refreshHistoryCount() { const n = history.list().length; $('#historyCount').textContent = n ? String(n) : ''; }
  refreshHistoryCount();
  function renderHistory() {
    const list = history.list();
    const box = $('#historyList'), foot = $('#historyFoot');
    if (!list.length) { box.innerHTML = '<li class="empty">還沒有紀錄。起一卦就會自動存在這裡。</li>'; foot.innerHTML = ''; return; }
    box.innerHTML = list.map((r, i) => {
      let c; try { c = compute(r); } catch (e) { return ''; }
      const q = r.question || `${topicLabel(r.topic)}，近況如何？`;
      const names = c.chart.bian ? `${c.chart.ben.name} 之 ${c.chart.bian.name}` : c.chart.ben.name;
      return `<li class="h-item" style="--i:${Math.min(i, 12)}">
        <button class="h-open" type="button" data-open="${esc(r.id)}"><span class="seal" aria-hidden="true">${c.verdict.grade}</span><span><span class="h-q">${esc(q)}</span><span class="h-sub">${esc(names)} · ${esc(r.dateISO)}</span></span></button>
        <button class="h-del" type="button" data-del="${esc(r.id)}" aria-label="刪除這筆"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </li>`;
    }).join('');
    foot.innerHTML = `<span>共 ${list.length} 筆</span><button class="link-btn" type="button" id="clearAsk">清空卦簿</button>`;
    $('#clearAsk').addEventListener('click', () => {
      foot.innerHTML = `<span>確定清空全部 ${list.length} 筆？</span><button class="link-btn" type="button" id="clearYes">清空</button><button class="link-btn" type="button" id="clearNo">取消</button>`;
      $('#clearYes').addEventListener('click', () => { history.clear(); refreshHistoryCount(); renderHistory(); });
      $('#clearNo').addEventListener('click', renderHistory);
      $('#clearNo').focus();
    });
  }
  $('#historyList').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) { history.remove(del.dataset.del); refreshHistoryCount(); renderHistory(); return; }
    const op = e.target.closest('[data-open]');
    if (op) {
      const rec = history.list().find(x => x.id === op.dataset.open);
      if (!rec || state.busy || state.flying || state.auto) return;
      closeSheet($('#historySheet')); pond.clear();
      $('#question').value = rec.question || '';
      dateInput.value = rec.dateISO; renderGanzhi();
      renderTopics(topicsEl, rec.topic, pickTopic); pickTopic(rec.topic);
      $$('[data-gender]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.gender === (rec.gender || ''))));
      buildSlots(); rec.values.forEach((v, i) => drawSlot(i, v, false)); state.values = rec.values.slice();
      showResult(rec, { fromCast: false });
      window.scrollTo({ top: 0, behavior: 'auto' });
    }
  });

  /* ---------- 對話框 ---------- */
  let lastFocus = null;
  function openSheet(el) {
    lastFocus = document.activeElement;
    el.hidden = false; el.classList.remove('closing');
    const f = el.querySelector('.panel-head [data-close]');
    setTimeout(() => f && f.focus(), 30);
  }
  async function closeSheet(el) {
    if (el.hidden) return;
    el.classList.add('closing');
    await sleep(240);
    el.hidden = true; el.classList.remove('closing');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  $$('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(s); }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { $$('.sheet').forEach(s => { if (!s.hidden) closeSheet(s); }); hideNote(); }
    if (e.key === 'Tab') {
      const s = $$('.sheet').find(x => !x.hidden); if (!s) return;
      const f = $$('button:not([disabled]), a[href], input, textarea', s).filter(x => x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  $('#historyBtn').addEventListener('click', () => { renderHistory(); openSheet($('#historySheet')); });

  /* ---------- 註釋 ---------- */
  const pop = $('#notePop');
  function showNote(t) {
    const r = t.getBoundingClientRect();
    pop.textContent = t.dataset.note; pop.hidden = false;
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let x = Math.min(window.innerWidth - w - 10, Math.max(10, r.left + r.width / 2 - w / 2));
    let y = r.top - h - 8; if (y < 10) y = r.bottom + 8;
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  }
  function hideNote() { pop.hidden = true; }
  document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-note]'); if (t && t.dataset.note) showNote(t); else if (!pop.hidden) hideNote(); });
  document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('[data-note]'); if (t && t.dataset.note) { showNote(t); } else hideNote(); });
  window.addEventListener('scroll', hideNote, { passive: true });

  /* ---------- 籤卡 ---------- */
  function wrapText(ctx, text, maxW) {
    const out = []; let line = '';
    for (const ch of text) {
      if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = /[，。、；：！？」』）]/.test(ch) ? '' : ch; if (line === '') { out[out.length - 1] += ch; } }
      else line += ch;
    }
    if (line) out.push(line);
    return out;
  }
  async function drawCard(rec, c) {
    const W = 1080, H = 1920;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const cs = getComputedStyle(document.documentElement);
    const tok = k => cs.getPropertyValue(k).trim();
    const dark = effectiveTheme() === 'dark';
    const paper = tok('--paper'), paper2 = tok('--paper-2'), ink = tok('--ink'), ink2 = tok('--ink-2'), ink3 = tok('--ink-3'), line = tok('--line-2'), seal = tok('--seal'), sealInk = tok('--seal-ink'), cin = tok('--cinnabar');
    const KAI = '"LXGW WenKai TC", "Kaiti TC", "BiauKai", serif', SONG = '"Noto Serif TC", "Songti TC", serif';
    const { chart, verdict, tx, info } = c;
    const q = rec.question || `${topicLabel(rec.topic)}，近況如何？`;
    const kd = verdict.keyDay;
    const strings = [chart.ben.name, chart.bian ? chart.bian.name : '', tx.now.head, q, verdict.grade, verdict.word, verdict.verdict, '第卦之關鍵日前後六爻排盤來算算你的未來年月日問', String(kd.date.getMonth() + 1), info.year.text + info.month.text + info.day.text, kd.text].join('');
    try { await Promise.all([document.fonts.load(`700 80px "LXGW WenKai TC"`, strings), document.fonts.load(`400 40px "LXGW WenKai TC"`, strings), document.fonts.load(`400 34px "Noto Serif TC"`, strings)]); } catch (e) {}
    // 紙
    ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
    const rnd = mulberry(7);
    ctx.globalAlpha = dark ? .05 : .07;
    for (let k = 0; k < 9000; k++) { ctx.fillStyle = rnd() < .5 ? ink : paper2; ctx.fillRect(rnd() * W, rnd() * H, 1.4, 1.4); }
    ctx.globalAlpha = 1;
    // 山
    ctx.save(); ctx.translate(0, H - 560);
    paintMountains(ctx, W, 560, tok('--wash').split(/\s+/).join(','), 17, 1.6);
    ctx.restore();
    // 紅日
    const sun = ctx.createRadialGradient(W * .78, 300, 10, W * .78, 300, 170);
    const sunRgb = tok('--sun').split(/\s+/).join(',');
    sun.addColorStop(0, `rgba(${sunRgb},.24)`); sun.addColorStop(.5, `rgba(${sunRgb},.1)`); sun.addColorStop(1, `rgba(${sunRgb},0)`);
    ctx.fillStyle = sun; ctx.fillRect(0, 0, W, 700);
    // 書籤孔與繩
    ctx.fillStyle = paper2; ctx.strokeStyle = line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, 120, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const cord = ctx.createLinearGradient(0, 136, 0, 250); cord.addColorStop(0, tok('--gold')); cord.addColorStop(1, cin);
    ctx.strokeStyle = cord; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W / 2, 136); ctx.lineTo(W / 2, 244); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    // 卦序與卦名
    ctx.fillStyle = ink3; ctx.font = `400 40px ${KAI}`;
    ctx.fillText(`第${E.cnNumber(chart.ben.number)}卦`, W / 2, 330);
    ctx.fillStyle = ink; ctx.font = `700 ${chart.ben.shortName.length > 1 ? 250 : 330}px ${KAI}`;
    const gw = ctx.measureText(chart.ben.shortName).width;
    let gx = W / 2 - 50, sx = gx + gw / 2 + 74;
    if (sx + 50 > W - 90) { const sh = sx + 50 - (W - 90); gx -= sh; sx -= sh; }
    ctx.fillText(chart.ben.shortName, gx, 650);
    // 印章
    ctx.save(); ctx.translate(sx, 430); ctx.rotate(-6 * Math.PI / 180);
    ctx.fillStyle = seal; ctx.fillRect(-48, 0, 96, 196);
    ctx.strokeStyle = sealInk; ctx.globalAlpha = .75; ctx.lineWidth = 3; ctx.strokeRect(-40, 8, 80, 180); ctx.globalAlpha = 1;
    ctx.fillStyle = sealInk; ctx.font = `700 64px ${KAI}`;
    ctx.fillText(verdict.grade[0], 0, 84); ctx.fillText(verdict.grade[1], 0, 160);
    ctx.restore();
    // 卦畫
    const bx = W / 2 - 170, bw = 340;
    [5, 4, 3, 2, 1, 0].forEach((i, k) => {
      const l = chart.lines[i]; const y = 740 + k * 44;
      ctx.fillStyle = l.moving ? cin : ink;
      if (l.yang) ctx.fillRect(bx, y, bw, 22);
      else { ctx.fillRect(bx, y, bw * .41, 22); ctx.fillRect(bx + bw * .59, y, bw * .41, 22); }
    });
    // 卦名列
    ctx.fillStyle = ink; ctx.font = `400 50px ${KAI}`;
    ctx.fillText(chart.bian ? `${chart.ben.name}　之　${chart.bian.name}` : chart.ben.name, W / 2, 1090);
    // 標題句
    ctx.fillStyle = cin; ctx.font = `700 70px ${KAI}`;
    const heads = wrapText(ctx, tx.now.head, 860);
    heads.slice(0, 2).forEach((t, k) => ctx.fillText(t, W / 2, 1210 + k * 90));
    let y = 1210 + Math.min(heads.length, 2) * 90 + 10;
    ctx.fillStyle = ink2; ctx.font = `400 40px ${KAI}`;
    ctx.fillText(`${verdict.word}・${verdict.verdict}`, W / 2, y); y += 90;
    // 所問
    ctx.fillStyle = ink2; ctx.font = `400 36px ${SONG}`;
    wrapText(ctx, `問：${q}`, 820).slice(0, 2).forEach((t, k) => ctx.fillText(t, W / 2, y + k * 54));
    y += 54 * Math.min(2, wrapText(ctx, `問：${q}`, 820).length) + 30;
    ctx.fillStyle = cin; ctx.font = `400 38px ${KAI}`;
    ctx.fillText(`關鍵日　${kd.date.getMonth() + 1}月${kd.date.getDate()}日（${kd.branch}日）前後`, W / 2, y);
    // 落款
    ctx.fillStyle = ink3; ctx.font = `400 32px ${SONG}`;
    ctx.fillText(`${info.year.text}年 ${info.month.text}月 ${info.day.text}日`, W / 2, H - 150);
    ctx.font = `400 34px ${KAI}`; ctx.fillStyle = ink2;
    ctx.fillText('六爻排盤　來算算你的未來', W / 2, H - 92);
    return cv;
  }
  let cardUrl = null, cardBlob = null, cardName = '六爻籤卡.png';
  // 在 claude.ai 預覽裡用平台的存檔；一般網頁用瀏覽器下載
  const inViewer = !!(window.claude && typeof window.claude.use === 'function');
  let downloadsNs = null;
  if (inViewer) {
    $('#cardDownload').hidden = true;
    Promise.resolve(window.claude.use('downloads')).then(ns => { downloadsNs = ns; $('#cardDownload').hidden = !ns; }).catch(() => {});
  }
  $('#cardDownload').addEventListener('click', async () => {
    if (!cardBlob) return;
    if (downloadsNs) {
      try { await downloadsNs.save({ filename: cardName, data: cardBlob }); }
      catch (e) { const c = e && e.code; if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') $('#cardDownload').hidden = true; }
      return;
    }
    const a = document.createElement('a'); a.href = cardUrl; a.download = cardName; document.body.appendChild(a); a.click(); a.remove();
  });
  async function openCard(rec, c) {
    const view = $('#cardView');
    view.innerHTML = '<span class="wait">磨墨中…</span>';
    openSheet($('#cardSheet'));
    const cv = await drawCard(rec, c);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    if (cardUrl) URL.revokeObjectURL(cardUrl);
    cardUrl = URL.createObjectURL(blob); cardBlob = blob;
    const name = `六爻籤卡-${c.chart.ben.name}.png`; cardName = name;
    view.innerHTML = `<img src="${cardUrl}" alt="籤卡：${esc(c.chart.ben.name)}，${esc(c.verdict.grade)}">`;
    const share = $('#cardShare');
    let file = null; try { file = new File([blob], name, { type: 'image/png' }); } catch (e) {}
    share.hidden = inViewer || !(file && navigator.canShare && navigator.canShare({ files: [file] }));
    share.onclick = async () => { try { await navigator.share({ files: [file], title: '六爻籤卡' }); } catch (e) {} };
  }

  /* ---------- 啟動 ---------- */
  $('#motionBtn').hidden = !motionAvailable();
  updateCastUI();
  const fontsReady = (document.fonts && document.fonts.ready) || Promise.resolve();
  requestAnimationFrame(() => { drawScenery(); syncThemeColor(); });
  fontsReady.then(() => {});
})();
</script>
